services:
  # PostgreSQL is configured with DATABASE_URL. Uploaded files use S3
  # configured through S3_BUCKET, S3_PREFIX, and S3_REGION.

  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP for NextAuth email magic link
